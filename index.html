<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple, elegant calculator app built with HTML, CSS, and JavaScript." />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator-wrapper">
    <div class="calculator">
      <div class="display">
        <div id="expression" class="expression"></div>
        <div id="result" class="result">0</div>
      </div>
      <div class="keypad">
        <button class="btn btn-utility" id="btn-clear" onclick="clearAll()">AC</button>
        <button class="btn btn-utility" onclick="toggleSign()">+/−</button>
        <button class="btn btn-utility" onclick="percentage()">%</button>
        <button class="btn btn-operator" onclick="appendOperator('/')">÷</button>

        <button class="btn" onclick="appendDigit('7')">7</button>
        <button class="btn" onclick="appendDigit('8')">8</button>
        <button class="btn" onclick="appendDigit('9')">9</button>
        <button class="btn btn-operator" onclick="appendOperator('*')">×</button>

        <button class="btn" onclick="appendDigit('4')">4</button>
        <button class="btn" onclick="appendDigit('5')">5</button>
        <button class="btn" onclick="appendDigit('6')">6</button>
        <button class="btn btn-operator" onclick="appendOperator('-')">−</button>

        <button class="btn" onclick="appendDigit('1')">1</button>
        <button class="btn" onclick="appendDigit('2')">2</button>
        <button class="btn" onclick="appendDigit('3')">3</button>
        <button class="btn btn-operator" onclick="appendOperator('+')">+</button>

        <button class="btn btn-zero" onclick="appendDigit('0')">0</button>
        <button class="btn" onclick="appendDot()">.</button>
        <button class="btn btn-equals" onclick="calculate()">=</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
